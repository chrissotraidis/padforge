name: Windows package check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -B -m unittest discover -s tests -p test_android_bootstrap.py -v
      - run: python -B -m unittest discover -s tests -p test_next_steps.py -v
      - run: python -B -m unittest discover -s tests -p test_game_data_folder.py -v
  packaged-player-flow:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Keep release files identical across build hosts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package and audit public downloads
        run: python scripts/package-release.py release-check
      - name: Check portable checksum bytes and all package hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = [IO.File]::ReadAllBytes((Join-Path $PWD 'release-check/SHA256SUMS'))
          if ($raw -contains 13) { throw 'SHA256SUMS contains CR bytes' }
          if ($raw.Length -eq 0 -or $raw[-1] -ne 10) { throw 'SHA256SUMS must end with LF' }
          $lines = [Text.Encoding]::UTF8.GetString($raw).TrimEnd("`n").Split("`n")
          if ($lines.Count -ne 3) { throw 'Expected checksums for all three packages' }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-f]{64})  (PadMint-v[^/\\]+-(windows|macos|linux)\.zip)$') {
              throw "Invalid checksum entry: $line"
            }
            $expected = $Matches[1]
            $name = $Matches[2]
            $actual = (Get-FileHash (Join-Path 'release-check' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch: $name" }
            Write-Host "Checksum verified: $name $actual"
          }
          Write-Host 'SHA256SUMS: LF only, no CR bytes, all three package hashes match'
      - name: Check the included Python and player flows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem release-check/*-windows.zip).FullName
          Expand-Archive $zip "$env:RUNNER_TEMP/package-check"
          $package = (Get-ChildItem "$env:RUNNER_TEMP/package-check" -Directory).FullName
          $tests = "$env:RUNNER_TEMP/player-checks"
          New-Item -ItemType Directory $tests | Out-Null
          Copy-Item tests/test_start.py, tests/test_finish_submodules.py, tests/test_host_preflight.py, tests/test_progress_output.py, tests/test_package.py, tests/test_tools.py, tests/fixtures.py, tests/test_next_steps.py, tests/test_game_data_folder.py, tests/test_ui.py $tests
          Push-Location $package
          try {
            & ./python/python.exe -m padmint --version
            if ($LASTEXITCODE -ne 0) { throw 'Included Python cannot start PadMint' }
            & ./python/python.exe -m unittest discover -s $tests -v
            if ($LASTEXITCODE -ne 0) { throw 'Guided setup, safe recovery or IPA validation failed' }
            & ./python/python.exe -m padmint audit $zip
            if ($LASTEXITCODE -ne 0) { throw 'Packaged content audit failed' }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: checked-public-packages
          path: release-check/
          retention-days: 7

  packaged-linux-player-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package and audit public downloads
        run: python scripts/package-release.py release-check
      - name: Check the Linux package and player flows
        shell: bash
        run: |
          set -euo pipefail
          linux_zip="$(realpath release-check/*-linux.zip)"
          player_tests="$RUNNER_TEMP/linux-player-checks"
          mkdir -p "$RUNNER_TEMP/linux-package-check" "$player_tests"
          unzip -q "$linux_zip" -d "$RUNNER_TEMP/linux-package-check"
          cp tests/test_start.py tests/test_finish_submodules.py tests/test_host_preflight.py tests/test_progress_output.py tests/test_package.py tests/test_tools.py tests/fixtures.py tests/test_next_steps.py tests/test_game_data_folder.py tests/test_ui.py "$player_tests/"
          linux_package=("$RUNNER_TEMP/linux-package-check"/PadMint-v*)
          test "${#linux_package[@]}" -eq 1
          cd "${linux_package[0]}"
          unset PYTHONPATH PYTHONHOME
          python -c 'from pathlib import Path; import padmint; assert Path(padmint.__file__).resolve().parent == Path.cwd() / "padmint", padmint.__file__; print("Packaged import:", padmint.__file__)'
          python -m padmint --version
          python -m unittest discover -s "$player_tests" -v
          python -m padmint audit "$linux_zip"

  # The universal iPhone module pipeline on native hosts: open-source SDK, LLVM compile,
  # import check and insertion into KartPad's public app (no game code anywhere).
  universal-ios-module:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep release files identical across build hosts
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: ~/.padmint/tools
          key: padmint-tools-${{ matrix.os }}-${{ hashFiles('padmint/tools.lock.json') }}
      - name: Unit tests for the module pipeline
        run: python -B -m unittest discover -s tests -p test_ios_module.py -v
        if: runner.os != 'Windows'
      - name: Build, check and insert a probe module
        run: python -B scripts/ios-module-probe.py "${{ runner.temp }}/ios-module-probe"
